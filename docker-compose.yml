# Local + simple-prod compose: a Postgres db service + the app (one log-writer
# process; the admin/log UI tails the per-process JSONL file).
# Override `image` and drop `build:` to deploy a prebuilt image from CI.

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: litestar_base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d litestar_base"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      # postgres:18 stores data in a major-version subdir and requires the
      # mount at /var/lib/postgresql (not .../data); the old path trips the
      # image's layout guard and the container exits on start.
      - pg_data:/var/lib/postgresql

  valkey:
    image: valkey/valkey:8
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - valkey_data:/data

  litestar_backend:
    build:
      context: ./src/litestar_backend
      args:
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
        GIT_BRANCH:     ${GIT_BRANCH:-unknown}
        GIT_DIRTY:      ${GIT_DIRTY:-0}
    image: litestar-backend:local
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Container-only overrides; .env still feeds APP_NAME / AUTH_ADMIN_TOKEN / etc.
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      # Free knob: each worker appends to the same JSONL log via O_APPEND
      # (atomic per-record), and metrics aggregate across workers via
      # prometheus_client multiprocess mode (see PROMETHEUS_MULTIPROC_DIR).
      APP_WORKERS: 2
      VOLUME_PATH: /data
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: litestar_base
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
      # UI history + live tail source of truth. Rotated by logrotate (create
      # mode) so an open export fd reads a consistent inode (spec 10.5 F).
      LOG_FILE_PATH: /data/logs/app.jsonl
      # Prometheus multiprocess mode: directory for per-worker mmap metric
      # shards. MetricsConfig + server.py honor this exact path (variant A);
      # server.py wipes stale *.db on start and the tmpfs mount below clears
      # it on container restart.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - app_data:/data
    tmpfs:
      - /tmp/prometheus
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Test/CI runner — full green gate (ruff + mypy + pytest) in the same uv
  # toolchain as the app, with the `dev` dependency group + tests/ layered on.
  # Profile-gated so `docker compose up` never starts it.
  #   docker compose run --rm litestar_backend_test                      # full gate
  #   docker compose run --rm litestar_backend_test pytest tests/unit -q # subset
  litestar_backend_test:
    profiles: ["test"]
    build:
      context: ./src/litestar_backend
      target: tester
    image: litestar-backend:test
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      VOLUME_PATH: /tmp/data
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: litestar_base
      # Integration/e2e tests reach the compose valkey instead of spinning a
      # testcontainer (no docker socket inside this container). The conftest
      # valkey_url fixture reuses VALKEY_URL; the e2e app config reads
      # VALKEY_HOST/VALKEY_PORT (env_prefix VALKEY_).
      VALKEY_URL: redis://valkey:6379/0
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
      # No .env in the test image; disable the Telegram reporter so e2e tests
      # that boot the app via lifespan don't demand a token.
      SNITCHBOT_DISABLED: "1"
    tmpfs:
      - /tmp/data

  event_microservice:
    build:
      context: ./src/event_microservice
    image: event-microservice:local
    restart: unless-stopped
    ports:
      - "9101:9100"
    environment:
      VALKEY_URL: redis://valkey:6379/0
    depends_on:
      valkey:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9100/metrics')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  event_microservice_worker:
    build:
      context: ./src/event_microservice
    image: event-microservice:local
    restart: unless-stopped
    # --web serves the SAQ monitoring panel (queues, jobs, retry/abort) on
    # container port 8080 -> host 8081. Protected by HTTP Basic auth when
    # SAQ_WEB_PASSWORD is set in .env (user "admin"); empty = no auth, dev only.
    command: ["saq", "root.entrypoints.saq_worker.settings", "--web", "--port", "8080"]
    ports:
      - "9102:9100"
      - "8081:8080"
    environment:
      VALKEY_URL: redis://valkey:6379/0
      AUTH_PASSWORD: ${SAQ_WEB_PASSWORD:-}
    depends_on:
      valkey:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9100/metrics')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  event_microservice_test:
    profiles: ["test"]
    build:
      context: ./src/event_microservice
      target: tester
    image: event-microservice:test
    depends_on:
      valkey:
        condition: service_healthy
    environment:
      VALKEY_URL: redis://valkey:6379/0

volumes:
  app_data:
  pg_data:
  valkey_data:
