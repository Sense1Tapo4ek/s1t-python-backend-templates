# Run all: pre-commit run --all-files
# NOTE: this environment has core.hooksPath set, so `pre-commit install` refuses
# until it is unset (or overridden repo-locally). `pre-commit run` works regardless;
# wire it into CI.
#
# ruff / ruff-format / mypy run via the project's OWN uv venv (local hooks) so the
# pinned tool versions never drift from `task lint` / `task type`. gitleaks is a
# standalone scanner binary, so it stays a pinned external hook. Python hooks are
# scoped to src/litestar_backend/; event_microservice keeps its own gate. gitleaks
# scans the whole repo.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff-litestar-backend
        name: ruff (litestar_backend)
        entry: bash -c 'cd src/litestar_backend && uv run ruff check --fix .'
        language: system
        types: [python]
        pass_filenames: false
        files: ^src/litestar_backend/

      - id: ruff-format-litestar-backend
        name: ruff-format (litestar_backend)
        entry: bash -c 'cd src/litestar_backend && uv run ruff format .'
        language: system
        types: [python]
        pass_filenames: false
        files: ^src/litestar_backend/

      - id: mypy-litestar-backend
        name: mypy (litestar_backend)
        entry: bash -c 'cd src/litestar_backend && uv run mypy'
        language: system
        types: [python]
        pass_filenames: false
        files: ^src/litestar_backend/
