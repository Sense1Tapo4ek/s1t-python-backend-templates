# Run all: pre-commit run --all-files
#
# Monorepo gate covering BOTH services. ruff / ruff-format / mypy run via EACH
# service's own uv venv (local hooks) so the pinned tool versions never drift from
# `task lint` / `task type`. Both services pin the SAME toolchain
# (ruff==0.15.16, mypy==2.1.0) -- keep them in sync (see CLAUDE.md "Toolchain").
# gitleaks scans the whole repo for secrets.
#
# NOTE: this environment had core.hooksPath set; it was unset (local, == the default
# .git/hooks) so `pre-commit install` could wire .git/hooks/pre-commit. `pre-commit
# run` works regardless of that.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # ---- litestar_backend ----
      - id: ruff-litestar-backend
        name: ruff (litestar_backend)
        entry: bash -c 'cd src/litestar_backend && uv run ruff check --fix .'
        language: system
        types: [python]
        pass_filenames: false
        files: ^src/litestar_backend/

      - id: ruff-format-litestar-backend
        name: ruff-format (litestar_backend)
        entry: bash -c 'cd src/litestar_backend && uv run ruff format .'
        language: system
        types: [python]
        pass_filenames: false
        files: ^src/litestar_backend/

      - id: mypy-litestar-backend
        name: mypy (litestar_backend)
        entry: bash -c 'cd src/litestar_backend && uv run mypy'
        language: system
        types: [python]
        pass_filenames: false
        files: ^src/litestar_backend/

      # ---- event_microservice ----
      - id: ruff-event-microservice
        name: ruff (event_microservice)
        entry: bash -c 'cd src/event_microservice && uv run ruff check --fix .'
        language: system
        types: [python]
        pass_filenames: false
        files: ^src/event_microservice/

      - id: ruff-format-event-microservice
        name: ruff-format (event_microservice)
        entry: bash -c 'cd src/event_microservice && uv run ruff format .'
        language: system
        types: [python]
        pass_filenames: false
        files: ^src/event_microservice/

      - id: mypy-event-microservice
        name: mypy (event_microservice)
        entry: bash -c 'cd src/event_microservice && uv run mypy'
        language: system
        types: [python]
        pass_filenames: false
        files: ^src/event_microservice/
