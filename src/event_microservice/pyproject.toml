[project]
name = "event_microservice"
version = "1.0.0"
description = "FastStream consumer + SAQ worker for the media-processing pipeline"
requires-python = ">=3.12"
dependencies = [
    "dishka>=1.10.1",
    "faststream[redis,cli]>=0.7.2",
    "msgspec>=0.21",
    "prometheus-client>=0.25",
    "pydantic-settings>=2.14.0",
    "redis[hiredis]>=7.4",
    "saq[web]>=0.26.4",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    # Shared monorepo toolchain: ruff/mypy pinned IDENTICALLY in litestar_backend.
    "import-linter>=2.1",
    "mypy==2.3.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24",
    "polyfactory>=2.18",
    "ruff==0.15.22",
    "testcontainers>=4.9",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["media_processing", "root", "shared"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src"]
namespace_packages = true
explicit_package_bases = true
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false


[tool.importlinter]
root_packages = ["media_processing", "root", "shared"]

# shared/ is the kernel: it never imports the bounded context (structure.md 1.1).
[[tool.importlinter.contracts]]
name = "shared imports no bounded context"
type = "forbidden"
source_modules = ["shared"]
forbidden_modules = ["media_processing"]

# Nothing imports root/ -- the outermost shell (structure.md 4).
[[tool.importlinter.contracts]]
name = "root is imported by nobody"
type = "forbidden"
source_modules = ["media_processing", "shared"]
forbidden_modules = ["root"]

# Layer direction: adapters -> ports -> app -> domain (structure.md 4).
# ignore_imports = the sanctioned ports -> adapters/driven seams
# (structure.md 4: PORTS/driven may import adapters/driven; the module-level
# prometheus counters live in adapters and are re-exported through
# ports/driving for the SAQ job surface).
[[tool.importlinter.contracts]]
name = "media_processing layers"
type = "layers"
layers = ["media_processing.adapters", "media_processing.ports", "media_processing.app", "media_processing.domain"]
ignore_imports = [
    "media_processing.ports.driven.valkey_event_publisher -> media_processing.adapters.driven.metrics",
    "media_processing.ports.driving.saq_support -> media_processing.adapters.driven.metrics",
    "media_processing.ports.driving.saq_support -> media_processing.adapters.driven.executors",
]
