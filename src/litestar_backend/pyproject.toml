[project]
name = "litestar_backend"
version = "1.0.0"
description = "Litestar backend service (media_example, auth, admin, db_example_litestar)"
requires-python = ">=3.12"
dependencies = [
    "advanced-alchemy>=1.11",
    "asyncpg>=0.31",
    "dishka>=1.10.1",
    "joserfc>=1.7",
    "litestar[jinja,prometheus]>=2.24.0",
    "msgspec>=0.21",
    "orjson>=3.11",
    "psycopg[binary]>=3.3",
    "pwdlib[argon2]>=0.2",
    "pydantic-settings>=2.14.0",
    "redis[hiredis]>=8.0",
    "snitchbot>=1.2.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "structlog>=26.1.0",
    "uvicorn>=0.51.0",
    "yoyo-migrations>=9.0",
]

[project.scripts]
start_litestar = "root.entrypoints.cli:main"

[dependency-groups]
dev = [
    # Shared monorepo toolchain: ruff/mypy pinned IDENTICALLY in event_microservice.
    "import-linter>=2.1",
    "mypy==2.3.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24",
    "polyfactory>=2.18",
    "ruff==0.15.22",
    "testcontainers>=4.9",
]

[tool.pytest_asyncio]
mode = "auto"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
# PEP 420: package dirs need no empty __init__.py. Required so non-editable
# builds still discover the namespace sub-packages.
namespaces = true

[tool.pytest.ini_options]
markers = [
    "unit: domain-level tests (no mocks, no I/O)",
    "flow: app-level tests (mocked interfaces)",
    "integration: real infra via testcontainers",
    "e2e: full application through the test client",
]
pythonpath = ["src", "tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["migrations", "storage"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length — formatter handles it
    "B008",  # function call in default arg — common Litestar/FastAPI pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "SIM117"]  # asserts and nested with-blocks are fine in tests

[tool.ruff.lint.isort]
known-first-party = ["admin", "auth", "db_example_litestar", "media_example", "root", "shared"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src"]
namespace_packages = true
explicit_package_bases = true
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = ["snitchbot.*", "yoyo.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["admin", "auth", "db_example_litestar", "media_example", "root", "shared"]

# Bounded contexts are mutually independent. Sanctioned cross-context channels:
# shared/ (open to all), ACLs (<ctx>.ports.driven.acl -> <other>.ports.driving),
# and framework guards/middleware from <other>.ports.driving / adapters
# (ports.md 1.5) -- each seam is recorded in ignore_imports with a citation.
# root/ (composition shell) is excluded: it imports everything by design.
[[tool.importlinter.contracts]]
name = "leaf bounded contexts are mutually independent"
type = "independence"
modules = ["auth", "admin", "media_example", "db_example_litestar"]
ignore_imports = [
    # guards + auth middleware on admin surfaces: ports.md 1.5
    "admin.adapters.driving.api.* -> auth.ports.driving",
    "admin.log.adapters.driving.api.* -> auth.ports.driving",
]

# shared/ is the kernel: it never imports a bounded context (structure.md 1.1).
[[tool.importlinter.contracts]]
name = "shared imports no bounded context"
type = "forbidden"
source_modules = ["shared"]
forbidden_modules = ["auth", "admin", "media_example", "db_example_litestar"]

# Nothing imports root/ -- it is the outermost shell (structure.md 4).
[[tool.importlinter.contracts]]
name = "root is imported by nobody"
type = "forbidden"
source_modules = ["auth", "admin", "media_example", "db_example_litestar", "shared"]
forbidden_modules = ["root"]

# Layer direction inside each context: adapters -> ports -> app -> domain
# (structure.md 4). db_example_litestar is a sanctioned hybrid (no domain/,
# DTOs reference the ORM model) so it gets no layers contract -- see its ADRs.
[[tool.importlinter.contracts]]
name = "auth layers"
type = "layers"
layers = ["auth.adapters", "auth.ports", "auth.app", "auth.domain"]

[[tool.importlinter.contracts]]
name = "media_example layers"
type = "layers"
layers = ["media_example.adapters", "media_example.ports", "media_example.app", "media_example.domain"]

[[tool.importlinter.contracts]]
name = "admin layers"
type = "layers"
layers = ["admin.adapters", "admin.ports", "admin.app"]

[[tool.importlinter.contracts]]
name = "admin.log layers"
type = "layers"
layers = ["admin.log.adapters", "admin.log.ports", "admin.log.app", "admin.log.domain"]
