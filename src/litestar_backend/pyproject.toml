[project]
name = "litestar_backend"
version = "1.0.0"
description = "Litestar backend service (media_example, auth, admin, db_example_litestar)"
requires-python = ">=3.12"
dependencies = [
    "advanced-alchemy>=1.11",
    "asyncpg>=0.30",
    "dishka>=1.10.1",
    "litestar[jinja,prometheus]>=2.23.0",
    "msgspec>=0.18",
    "orjson>=3.10",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.12.0",
    "redis[hiredis]>=5.0",
    "snitchbot>=1.2.0",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=25.5.0",
    "uvicorn>=0.40.0",
    "yoyo-migrations>=9.0",
]

[project.scripts]
start_litestar = "root.entrypoints.cli:main"

[dependency-groups]
dev = [
    # Shared monorepo toolchain: ruff/mypy pinned IDENTICALLY in event_microservice.
    "import-linter>=2.1",
    "mypy==2.1.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24",
    "polyfactory>=2.18",
    "ruff==0.15.16",
    "testcontainers>=4.9",
]

[tool.pytest_asyncio]
mode = "auto"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
# PEP 420: package dirs need no empty __init__.py. Required so non-editable
# builds still discover the namespace sub-packages.
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["migrations", "storage"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length — formatter handles it
    "B008",  # function call in default arg — common Litestar/FastAPI pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "SIM117"]  # asserts and nested with-blocks are fine in tests

[tool.ruff.lint.isort]
known-first-party = ["admin", "auth", "root", "shared"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src"]
namespace_packages = true
explicit_package_bases = true
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = ["snitchbot.*", "yoyo.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["admin", "auth", "db_example_litestar", "media_example", "root", "shared"]

# Single rule: leaf bounded contexts are mutually independent (no context imports
# another's internals, directly or transitively). The only sanctioned cross-context
# channels are: shared/ (open to all), an ACL
# (<ctx>.ports.driven.acl -> <other>.ports.driving), and framework guards
# (<other>.ports.driving.guards, ports.md 1.5). root/ (composition shell, imports
# everything) and shared/ (kernel, imported by everyone) are intentionally excluded.
[[tool.importlinter.contracts]]
name = "leaf bounded contexts are mutually independent"
type = "independence"
modules = ["auth", "admin", "media_example", "db_example_litestar"]
# Each legitimate cross-context seam is recorded here, reviewed, with a rule citation:
# ignore_imports = [
#     "admin.adapters.driving.api.* -> auth.ports.driving.guards",   # guard: ports.md 1.5
#     "media_example.ports.driven.acl.* -> billing.ports.driving",   # ACL: structure.md 4
# ]
