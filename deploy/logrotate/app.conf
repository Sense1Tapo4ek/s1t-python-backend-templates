# logrotate config for the admin/log file-tail source.
#
# create-mode (NOT copytruncate): logrotate renames app.jsonl -> app.jsonl.1
# and creates a fresh app.jsonl. The app's WatchedFileHandler detects the
# inode change on the next emit and reopens the new file. An in-flight
# /export fd keeps reading the renamed inode to EOF -> consistent snapshot
# (spec 10.5 F). copytruncate would corrupt that snapshot.
#
# Install: copy to /etc/logrotate.d/litestar-app, adjust the path.

/data/logs/app.jsonl {
    daily
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    create 0640 root root
    # No postrotate/copytruncate: the app reopens via WatchedFileHandler.
}
